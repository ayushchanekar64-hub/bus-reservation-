# ==============================================================================
# Bus Reservation System - Database Configuration
# ==============================================================================
# Database connection settings
db.url=jdbc:postgresql://localhost:5432/bus_reservation_db
db.user=postgres
db.password=postgres
db.driver=org.postgresql.Driver

# Connection Pool / Timeout settings (in seconds)
db.timeout=3

# Operational Mode:
# 'postgres'  : Force PostgreSQL database connection (throws error if unreachable)
# 'inmemory'  : Run completely in-memory with preloaded sample data
# 'auto'      : Attempt PostgreSQL first; smoothly fall back to In-Memory if database is not running
db.mode=postgres
